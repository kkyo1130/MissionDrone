name: Backend integration tests

on:
  push:
    branches:
      - feat/F04-F07-backend-integration
  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run regression and integration tests
        env:
          DATABASE_URL: sqlite:///./missiondrone-ci.db
        run: python -m pytest -q
