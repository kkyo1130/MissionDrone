[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "missiondrone-backend"
version = "0.1.0"
description = "FastAPI backend for the MissionDrone prototype"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "jinja2>=3.1,<4",
    "numpy>=1.26,<3",
    "pydantic>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "pymysql>=1.1,<2",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
ai = [
    "scikit-learn>=1.4,<2",
]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
