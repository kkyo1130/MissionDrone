services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: missiondrone
      MYSQL_USER: missiondrone
      MYSQL_PASSWORD: missiondrone
      MYSQL_ROOT_PASSWORD: local-root-only
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
volumes:
  mysql-data:
