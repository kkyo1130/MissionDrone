<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MissionDrone 3D Risk Visualization</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-1: #f6f4ef;
        --bg-2: #e6efe9;
        --ink: #12261d;
        --accent: #d06f2f;
        --accent-2: #2d6a4f;
        --card: rgba(255, 255, 255, 0.86);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: "Space Grotesk", sans-serif; color: var(--ink); }
      body {
        background: radial-gradient(circle at 20% 15%, #fef7e7 0%, var(--bg-1) 40%),
          radial-gradient(circle at 80% 70%, #dceee2 0%, var(--bg-2) 45%);
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        padding: 14px 18px;
        border-bottom: 1px solid rgba(18, 38, 29, 0.12);
        backdrop-filter: blur(6px);
        background: rgba(255, 255, 255, 0.55);
      }
      header h1 { margin: 0; font-size: 1.05rem; letter-spacing: 0.02em; }
      main { display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
      .panel {
        padding: 16px;
        background: var(--card);
        border-right: 1px solid rgba(18, 38, 29, 0.1);
        overflow: auto;
      }
      .panel h2 { margin: 6px 0 12px; font-size: 1rem; }
      .group { margin-bottom: 12px; }
      label { display: block; margin-bottom: 4px; font-size: 0.9rem; }
      input:not([type="checkbox"]) {
        width: 100%;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid rgba(18, 38, 29, 0.25);
        background: #fff;
      }
      .layer-control {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
        font-size: 0.88rem;
      }
      .layer-control input { width: auto; margin: 0; }
      .legend-ramp {
        height: 10px;
        margin: 6px 0;
        border-radius: 6px;
        background: linear-gradient(90deg, #ffd166, #d00000);
      }
      .legend-labels { display: flex; justify-content: space-between; font-size: 0.76rem; }
      .layer-note { margin: 8px 0 0; font-size: 0.76rem; color: #53645b; }
      button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 10px;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent), #b94f1a);
      }
      button.secondary {
        margin-top: 8px;
        background: linear-gradient(135deg, var(--accent-2), #20513b);
      }
      #status {
        margin-top: 10px;
        padding: 10px;
        border-radius: 10px;
        font-size: 0.88rem;
        background: rgba(208, 111, 47, 0.1);
      }
      #viewer { width: 100%; height: 100%; min-height: 420px; }
      @media (max-width: 900px) {
        main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        .panel { border-right: 0; border-bottom: 1px solid rgba(18, 38, 29, 0.1); }
      }
    </style>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.120/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1>MissionDrone 3D Risk Visualization Prototype</h1>
    </header>
    <main>
      <aside class="panel">
        <h2>Scenario Input</h2>
        <div class="group">
          <label for="start">Start (x,y,z)</label>
          <input id="start" value="2,2,6" />
        </div>
        <div class="group">
          <label for="end">End (x,y,z)</label>
          <input id="end" value="28,28,6" />
        </div>
        <div class="group">
          <label for="windSpeed">Wind Speed (m/s)</label>
          <input id="windSpeed" type="number" min="0" max="60" step="0.1" value="8" />
        </div>
        <div class="group">
          <label for="windDirection">Wind Direction (degrees)</label>
          <input id="windDirection" type="number" min="0" max="360" step="1" value="90" />
        </div>
        <button id="btnRoute">Find Route</button>
        <button id="btnRisk" class="secondary">Load Risk Voxels</button>
        <h2>지도 레이어</h2>
        <label class="layer-control">
          <input id="showObstacles" type="checkbox" checked />
          건물·장애물 복셀
        </label>
        <label class="layer-control">
          <input id="showRisk" type="checkbox" checked />
          위험도 복셀
        </label>
        <div class="legend-ramp" aria-label="위험도 낮음에서 높음으로 표시"></div>
        <div class="legend-labels"><span>0.7 기준</span><span>1.0 높음</span></div>
        <p class="layer-note">Mock 환경의 휴리스틱 위험도이며 실제 비행 안전성을 보장하지 않습니다.</p>
        <div id="status">Grid: {{ grid_shape }} ({{ voxel_size_m }} m voxels)</div>
      </aside>
      <section id="viewer"></section>
    </main>
    <script>
      window.APP_GRID_SPEC = {
        shape: {{ grid_shape | tojson }},
        voxelSizeM: {{ voxel_size_m | tojson }},
        originWgs84: {{ origin_wgs84 | tojson }},
        cesiumIonToken: {{ cesium_ion_token | tojson }}
      };
    </script>
    <script src="{{ url_for('static', path='js/map.js') }}"></script>
  </body>
</html>
